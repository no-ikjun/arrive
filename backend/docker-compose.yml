# 서버 배포는 gistag-net의 Postgres를 사용하고 이 파일로 Postgres를 띄우지 않습니다.
# 로컬 컨테이너로 API만 띄울 때 사용합니다. DATABASE_URL은 환경 변수로 넘깁니다.
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      VENUE_CATALOG_INDEX_PATH: /contracts/venues/index.json
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
