openapi: 3.0.3
info:
  title: arrive session API
  version: 0.1.0
  description: >-
    arrive 차량 앱과 동승자 읽기 전용 카드 간 방문 계획 공유 계약.
    인증 토큰은 서로 다른 owner/read 권한이며 서버는 클라이언트의 상태를 그대로 신뢰하지 않는다.
    장소 목록은 각 장소의 현재 버전만 반환하고, 이미 만든 방문은 생성 당시의 장소와 버전을 유지한다.
    장소 데이터의 시연 상태를 유지한다.
servers:
  - url: http://localhost:8080
    description: Local development only; use HTTPS for deployment.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
  /v1/venues:
    get:
      operationId: listVenues
      description: >-
        Current version of each supported venue, in index order.
        One item per venue. An empty catalog index returns 200 with items [].
      responses:
        '200':
          description: Supported venues
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueList'}
  /v1/venues/{venueId}:
    get:
      operationId: getVenue
      description: Current catalog version for preparing a new visit. Missing venues are 404.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: >-
            Current versioned venue catalog. Preserve unverified labels;
            non-null image-derived coordinates are not verified routing entrances.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Venue'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/venues/{venueId}/versions/{catalogVersion}:
    get:
      operationId: getVenueVersion
      description: >-
        Exact catalog for an existing visit. Do not substitute another version.
        The response venueId and catalogVersion match the request. No session token is accepted on this path.
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
        - {name: catalogVersion, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Requested venue version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Venue'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions:
    post:
      operationId: createSession
      description: >-
        Creates a session from the requested venueId and catalogVersion.
        A registered past version is accepted. An unknown venue is 404.
        A known venue with an unknown version is 400 and is not replaced by the current version.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [venueId, catalogVersion]
              properties:
                venueId: {type: string, example: gist-oryong-demo}
                catalogVersion: {type: string, example: oryong-demo-v2}
      responses:
        '201':
          description: >-
            New PLANNED session at revision 1, expires 24 hours after creation.
            Same idempotency key/body returns the original response until expiry or revocation.
          content:
            application/json:
              schema:
                type: object
                required: [session, ownerToken, shareToken]
                properties:
                  session: {$ref: '#/components/schemas/Session'}
                  ownerToken: {type: string, minLength: 43, description: 32 cryptographically random bytes encoded base64url}
                  shareToken: {type: string, minLength: 43, description: Independently generated read-only capability}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      operationId: getOwnedSession
      security: [{ownerBearer: []}]
      responses:
        '200':
          description: Current owner snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteSession
      security: [{ownerBearer: []}]
      responses:
        '204': {description: Session deleted and both capabilities revoked; creation key cannot resurrect it}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions/{sessionId}/events:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      operationId: applySessionEvent
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, event]
              properties:
                expectedRevision: {type: integer, minimum: 1}
                event:
                  type: string
                  enum: [START, CONFIRM_DROPOFF, REJECT_PARKING, CONFIRM_PARKED, CONFIRM_REUNION, CANCEL]
      responses:
        '200':
          description: >-
            Atomic event application increments revision once. Exact authenticated retry
            returns the original snapshot without reapplying the event, even if expectedRevision is now old.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/CatalogUnavailable'}
  /v1/shared-session:
    get:
      operationId: getSharedSession
      security: [{shareBearer: []}]
      description: >-
        Read-only snapshot for companion UI. Foreground polling every 5 seconds is sufficient.
        Do not include owner credentials, live vehicle location, names, phone numbers or device identifiers.
      responses:
        '200':
          description: Current shared snapshot; Cache-Control must be no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    ownerBearer: {type: http, scheme: bearer, description: Owner token for exactly one session}
    shareBearer: {type: http, scheme: bearer, description: Read-only token; never valid for owner endpoints}
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Random UUID reused only for retries of the same request
  schemas:
    Point:
      type: object
      required: [id, name, coordinate, instructions, imageUrl]
      properties:
        id: {type: string}
        name: {type: string}
        instructions: {type: string}
        imageUrl: {type: string, format: uri, nullable: true}
        coordinate:
          type: object
          nullable: true
          required: [latitude, longitude]
          properties:
            latitude: {type: number, minimum: -90, maximum: 90}
            longitude: {type: number, minimum: -180, maximum: 180}
    VenueSummary:
      type: object
      required: [venueId, catalogVersion, name, verification]
      properties:
        venueId: {type: string, example: gist-oryong-demo}
        catalogVersion: {type: string, example: oryong-demo-v2}
        name: {type: string, example: GIST 오룡관}
        verification: {type: string, enum: [DEMO_UNVERIFIED, VERIFIED]}
    VenueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VenueSummary'}
    Venue:
      type: object
      required: [venueId, catalogVersion, name, verification, notice, dropoff, meetingPoint, parkingCandidates]
      properties:
        venueId: {type: string}
        catalogVersion: {type: string}
        name: {type: string}
        verification: {type: string, enum: [DEMO_UNVERIFIED, VERIFIED]}
        notice: {type: string}
        dropoff: {$ref: '#/components/schemas/Point'}
        meetingPoint: {$ref: '#/components/schemas/Point'}
        parkingCandidates:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Point'}
    Session:
      type: object
      required: [id, venueId, catalogVersion, stage, parkingId, excludedParkingIds, meetingPointId, revision, createdAt, updatedAt, expiresAt, dataMode]
      properties:
        id: {type: string, format: uuid}
        venueId: {type: string}
        catalogVersion: {type: string}
        stage:
          type: string
          enum: [PLANNED, TO_DROPOFF, TO_PARKING, WALKING_TO_MEETING, REUNITED, CANCELLED]
        parkingId: {type: string, nullable: true}
        excludedParkingIds: {type: array, uniqueItems: true, items: {type: string}}
        meetingPointId: {type: string}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        dataMode: {type: string, enum: [DEMO, VERIFIED]}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        currentRevision: {type: integer, minimum: 1}
  responses:
    BadRequest:
      description: Invalid request shape, unsupported venue version, or unknown event
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing credentials or wrong token type
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource absent, expired, revoked, or not owned by this token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Invalid transition, stale revision, or idempotency key reused with a different body
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests; send Retry-After header
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CatalogUnavailable:
      description: >-
        The session's pinned venue version is not loaded. The event is not applied,
        revision is unchanged, and this response is not stored for idempotent replay.
        Put that version file back in the index and restart. Do not retarget the session
        to the current version. Detail lookup of the missing pair remains 404.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: CATALOG_UNAVAILABLE
            message: 방문에 고정된 장소 정보를 현재 사용할 수 없습니다.
