openapi: 3.0.3
info:
  title: Arrive Together session API
  version: 0.1.0
  description: >-
    차량 앱과 동승자 읽기 전용 카드 간 방문 계획 공유 계약.
    인증 토큰은 서로 다른 owner/read 권한이며 서버는 클라이언트의 상태를 그대로 신뢰하지 않는다.
    현재 Android 앱은 로컬 시연이며 이 API의 HTTP 클라이언트는 아직 구현하지 않았다.
servers:
  - url: http://localhost:8080
    description: Local development only; use HTTPS for deployment.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
  /v1/venues/{venueId}:
    get:
      operationId: getVenue
      parameters:
        - {name: venueId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Versioned venue catalog. Preserve unverified labels; non-null image-derived coordinates are not verified routing entrances.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Venue'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [venueId, catalogVersion]
              properties:
                venueId: {type: string, example: gist-oryong-demo}
                catalogVersion: {type: string, example: oryong-demo-v2}
      responses:
        '201':
          description: >-
            New PLANNED session at revision 1, expires 24 hours after creation.
            Same idempotency key/body returns the original response until expiry or revocation.
          content:
            application/json:
              schema:
                type: object
                required: [session, ownerToken, shareToken]
                properties:
                  session: {$ref: '#/components/schemas/Session'}
                  ownerToken: {type: string, minLength: 43, description: 32 cryptographically random bytes encoded base64url}
                  shareToken: {type: string, minLength: 43, description: Independently generated read-only capability}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      operationId: getOwnedSession
      security: [{ownerBearer: []}]
      responses:
        '200':
          description: Current owner snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteSession
      security: [{ownerBearer: []}]
      responses:
        '204': {description: Session deleted and both capabilities revoked; creation key cannot resurrect it}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sessions/{sessionId}/events:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      operationId: applySessionEvent
      security: [{ownerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, event]
              properties:
                expectedRevision: {type: integer, minimum: 1}
                event:
                  type: string
                  enum: [START, CONFIRM_DROPOFF, REJECT_PARKING, CONFIRM_PARKED, CONFIRM_REUNION, CANCEL]
      responses:
        '200':
          description: >-
            Atomic event application increments revision once. Exact authenticated retry
            returns the original snapshot without reapplying the event, even if expectedRevision is now old.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/shared-session:
    get:
      operationId: getSharedSession
      security: [{shareBearer: []}]
      description: >-
        Read-only snapshot for companion UI. Foreground polling every 5 seconds is sufficient.
        Do not include owner credentials, live vehicle location, names, phone numbers or device identifiers.
      responses:
        '200':
          description: Current shared snapshot; Cache-Control must be no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    ownerBearer: {type: http, scheme: bearer, description: Owner token for exactly one session}
    shareBearer: {type: http, scheme: bearer, description: Read-only token; never valid for owner endpoints}
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Random UUID reused only for retries of the same request
  schemas:
    Point:
      type: object
      required: [id, name, coordinate, instructions, imageUrl]
      properties:
        id: {type: string}
        name: {type: string}
        instructions: {type: string}
        imageUrl: {type: string, format: uri, nullable: true}
        coordinate:
          type: object
          nullable: true
          required: [latitude, longitude]
          properties:
            latitude: {type: number, minimum: -90, maximum: 90}
            longitude: {type: number, minimum: -180, maximum: 180}
    Venue:
      type: object
      required: [venueId, catalogVersion, name, verification, notice, dropoff, meetingPoint, parkingCandidates]
      properties:
        venueId: {type: string}
        catalogVersion: {type: string}
        name: {type: string}
        verification: {type: string, enum: [DEMO_UNVERIFIED, VERIFIED]}
        notice: {type: string}
        dropoff: {$ref: '#/components/schemas/Point'}
        meetingPoint: {$ref: '#/components/schemas/Point'}
        parkingCandidates:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Point'}
    Session:
      type: object
      required: [id, venueId, catalogVersion, stage, parkingId, excludedParkingIds, meetingPointId, revision, createdAt, updatedAt, expiresAt, dataMode]
      properties:
        id: {type: string, format: uuid}
        venueId: {type: string}
        catalogVersion: {type: string}
        stage:
          type: string
          enum: [PLANNED, TO_DROPOFF, TO_PARKING, WALKING_TO_MEETING, REUNITED, CANCELLED]
        parkingId: {type: string, nullable: true}
        excludedParkingIds: {type: array, uniqueItems: true, items: {type: string}}
        meetingPointId: {type: string}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        dataMode: {type: string, enum: [DEMO, VERIFIED]}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        currentRevision: {type: integer, minimum: 1}
  responses:
    BadRequest:
      description: Invalid request shape, unsupported venue version, or unknown event
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing credentials or wrong token type
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource absent, expired, revoked, or not owned by this token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Invalid transition, stale revision, or idempotency key reused with a different body
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests; send Retry-After header
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
