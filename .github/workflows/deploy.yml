name: CI/CD (k3s)

on:
  push:
    branches: [main]
    paths: ['backend/**', 'contracts/oryong-demo.json', 'contracts/venues/**', '.github/workflows/deploy.yml', 'scripts/ci/**']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'contracts/oryong-demo.json', 'contracts/venues/**', '.github/workflows/deploy.yml', 'scripts/ci/**']
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight production deployment. The host also locks across repos.
concurrency:
  group: k3s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the production branch for manual deployments
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/main' ]; then
            echo 'Select main in the Run workflow branch dropdown.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Test application
        working-directory: backend
        run: npm run test:ci
      - name: Build application
        working-directory: backend
        run: npm run build

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: no-ikjun/lightsail-infra/.github/workflows/k3s-release.yml@6ca6b41f5d1c970f8c7fe45098ff70071968ff72
    with:
      service: arrive
      production_branch: main
      image_repository: docker.io/ikjunchoi/arrive-together-be
      dockerfile: backend/Dockerfile
      build_context: .
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
